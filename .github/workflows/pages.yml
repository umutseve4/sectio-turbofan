name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Dogrulanmamis bir sey yayinlanmaz: verify.mjs kirmiziysa is burada durur.
      - name: cevrimdisi dogrulama
        run: node verify.mjs

      - name: yayinlanan dosyalari topla
        run: |
          set -eu
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          test -s _site/index.html
          echo "index.html: $(wc -c < _site/index.html) bayt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
