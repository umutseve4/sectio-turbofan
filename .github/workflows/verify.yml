name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: node version
        run: node --version
      - name: offline verification
        run: node verify.mjs

      # The README publishes a check count. A hand written number goes stale
      # quietly (it did once: the README said 27 while 29 were running), so we
      # count the checks that actually ran and compare them against the README.
      #
      # The three anchors below are English because the README is English. They
      # are the same three places as before, re-anchored, not removed:
      #   1. the badge URL
      #   2. the sentence in the Verification section
      #   3. the sentence in the Limits section
      - name: is the check count in the README correct
        run: |
          set -eu
          node verify.mjs > /tmp/verify.log 2>&1
          ok=$(grep -c '^  ok ' /tmp/verify.log || true)
          fail=$(grep -c '^  FAIL ' /tmp/verify.log || true)
          total=$(( ok + fail ))
          echo "::notice title=check count::ok=$ok fail=$fail total=$total"
          {
            echo "## Check count"
            echo ""
            echo "- passed: **$ok**"
            echo "- failed: **$fail**"
            echo "- total: **$total**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" -ne 0 ]; then
            echo "verify.mjs failed $fail check(s)" >&2
            exit 1
          fi

          miss=0
          grep -qF "checks-$total-" README.md || {
            echo "the badge does not say $total" >&2; miss=1;
          }
          grep -qF "**$total checks**" README.md || {
            echo "the text does not say '**$total checks**'" >&2; miss=1;
          }
          grep -qF "The $total checks above" README.md || {
            echo "the Limits section does not say $total" >&2; miss=1;
          }
          if [ "$miss" -ne 0 ]; then
            echo "::error title=README is stale::CI counts $total checks, the README states a different number."
            exit 1
          fi
          echo "README and CI agree on the same number: $total"
